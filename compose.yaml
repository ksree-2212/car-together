services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: car_together
      POSTGRES_USER: car_together
      POSTGRES_PASSWORD: car_together_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - car_together_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_together -d car_together"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://car_together:car_together_dev@postgres:5432/car_together
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      CAR_AGENT_MODEL: ${CAR_AGENT_MODEL:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  car_together_postgres:
